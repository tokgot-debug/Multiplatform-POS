<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPOS Pro — KRA eTIMS Multi-Platform POS</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/ui/styles.css">
</head>
<body class="dark-mode">
  <div id="app-container">

    <!-- ═══════════════════════════════════════════════════
         Fast User PIN Switch Modal
    ════════════════════════════════════════════════════ -->
    <div id="pin-modal" class="modal active">
      <div class="tablet-mockup">
        <div class="tablet-screen">
          <div class="modal-content pin-switcher-content" style="border: none; background: transparent; box-shadow: none; padding: 24px 24px 12px 24px; max-width: 100%;">
            <h2>Enter Till PIN</h2>
            <p>Select your user account and enter your 4-digit PIN</p>

            <div class="user-select-dropdown" style="margin-bottom: 24px;">
              <select id="pin-user-select" style="width: 100%; padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #fff; font-size: 16px; font-family: var(--font-main);">
                <option value="" disabled selected>Select your user account...</option>
                <!-- Populated dynamically -->
              </select>
            </div>

            <div class="pin-input-area">
              <input type="password" id="pin-input" readonly maxlength="4" placeholder="••••">
              <div class="numpad">
                <button class="numpad-btn" data-val="1">1</button>
                <button class="numpad-btn" data-val="2">2</button>
                <button class="numpad-btn" data-val="3">3</button>
                <button class="numpad-btn" data-val="4">4</button>
                <button class="numpad-btn" data-val="5">5</button>
                <button class="numpad-btn" data-val="6">6</button>
                <button class="numpad-btn" data-val="7">7</button>
                <button class="numpad-btn" data-val="8">8</button>
                <button class="numpad-btn" data-val="9">9</button>
                <button class="numpad-btn clear" id="numpad-clear">C</button>
                <button class="numpad-btn" data-val="0">0</button>
                <button class="numpad-btn ok" id="numpad-ok">OK</button>
              </div>
            </div>
            <p class="error-msg" id="pin-error"></p>
            
            <!-- Brand Footer -->
            <div class="brand-footer" style="margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(200, 130, 42, 0.15); width: 100%; text-align: center;">
              <div style="font-family: var(--font-display); font-size: 11px; font-weight: 800; color: var(--accent-amber); letter-spacing: 2px; text-transform: uppercase; opacity: 0.85;">
                Vanbransa ProPos
              </div>
              <div style="font-size: 9px; color: var(--text-muted); margin-top: 4px; letter-spacing: 1.5px; text-transform: uppercase;">
                Enterprise Edition
              </div>
            </div>
          </div>
        </div>
        <div class="bezel-logo">Vanbransa</div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════
         Main POS Shell — Sidebar Layout
    ════════════════════════════════════════════════════ -->
    <div id="pos-shell" class="hidden">

      <!-- ── Left Sidebar ──────────────────────────────── -->
      <aside class="app-sidebar">

        <!-- Logo -->
        <div class="sidebar-logo" style="padding: 10px 0; display: flex; justify-content: center; align-items: center;">
          <img src="/logo.png" alt="Titanium Logo" style="height: 38px; object-fit: contain;">
        </div>

        <!-- Status badges -->
        <div class="sidebar-status-row">
          <div id="connectivity-indicator" class="status-badge online">
            <span class="badge-dot"></span>
            <span class="badge-text">Online</span>
          </div>
          <div id="fiscal-queue-indicator" class="status-badge queued hidden">
            <span class="badge-text" id="fiscal-queue-count">0 Syncing</span>
          </div>
        </div>

        <!-- Nav label -->
        <div class="sidebar-section-label">DASHBOARD MODULES</div>

        <!-- Navigation items -->
        <nav class="sidebar-nav" id="sidebar-nav">
          <button class="sidebar-nav-btn active" data-tab="till">
            <span class="snb-icon">🏪</span>
            <span class="snb-label">Dashboard</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="orders">
            <span class="snb-icon">🧾</span>
            <span class="snb-label">Orders Viewer</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="shifts">
            <span class="snb-icon">💵</span>
            <span class="snb-label">Shift Management</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="inventory">
            <span class="snb-icon">🍽️</span>
            <span class="snb-label">Menu Admin</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="mpesa">
            <span class="snb-icon">📱</span>
            <span class="snb-label">Mpesa</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="store-stock">
            <span class="snb-icon">📦</span>
            <span class="snb-label">Store Stock</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="house-stock">
            <span class="snb-icon">📊</span>
            <span class="snb-label">House Stock</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="users">
            <span class="snb-icon">👥</span>
            <span class="snb-label">Users</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="audit-logs">
            <span class="snb-icon">📜</span>
            <span class="snb-label">Audit Logs</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="subscriptions">
            <span class="snb-icon">💎</span>
            <span class="snb-label">Subscription</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="kds">
            <span class="snb-icon">🍳</span>
            <span class="snb-label">Kitchen Display</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="procurement">
            <span class="snb-icon">📦</span>
            <span class="snb-label">Procurement</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="customers">
            <span class="snb-icon">👥</span>
            <span class="snb-label">CRM &amp; Loyalty</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="finance">
            <span class="snb-icon">📈</span>
            <span class="snb-label">Financials & AI</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="qrtools">
            <span class="snb-icon">🔧</span>
            <span class="snb-label">QR &amp; Tools</span>
          </button>
          <button class="sidebar-nav-btn" data-tab="settings">
            <span class="snb-icon">⚙️</span>
            <span class="snb-label">Settings</span>
          </button>
        </nav>

        <!-- Bottom: user profile + sign out -->
        <div class="sidebar-footer">
          <div class="sidebar-user">
            <div class="sidebar-avatar" id="sidebar-avatar">?</div>
            <div class="sidebar-user-info">
              <div class="sidebar-user-name" id="sidebar-username">—</div>
              <div class="sidebar-user-role" id="sidebar-userrole">—</div>
            </div>
          </div>
          <button class="sidebar-signout-btn" id="lock-app">
            <span>⏻</span> SIGN OUT
          </button>
        </div>
      </aside>

      <!-- ── Main Content ───────────────────────────────── -->
      <main class="app-main-content">

        <!-- Till / Dashboard Tab -->
        <section id="view-till" class="tab-view active"></section>

        <!-- Orders Viewer Tab -->
        <section id="view-orders" class="tab-view hidden"></section>

        <!-- Shifts / Cash Ledger Tab -->
        <section id="view-shifts" class="tab-view hidden"></section>

        <!-- Inventory / Menu Admin Tab -->
        <section id="view-inventory" class="tab-view hidden"></section>

        <!-- Mpesa Payments Viewer Tab -->
        <section id="view-mpesa" class="tab-view hidden"></section>

        <!-- Store Stock / Inventory Management Tab -->
        <section id="view-store-stock" class="tab-view hidden"></section>

        <!-- Reports / House Stock Tab -->
        <section id="view-house-stock" class="tab-view hidden"></section>

        <!-- Users Tab -->
        <section id="view-users" class="tab-view hidden"></section>

        <!-- Audit Logs Tab -->
        <section id="view-audit-logs" class="tab-view hidden"></section>

        <!-- Subscription Tab -->
        <section id="view-subscriptions" class="tab-view hidden"></section>

        <!-- KDS Tab -->
        <section id="view-kds" class="tab-view hidden"></section>

        <!-- Procurement Tab -->
        <section id="view-procurement" class="tab-view hidden"></section>

        <!-- Customers CRM Tab -->
        <section id="view-customers" class="tab-view hidden"></section>

        <!-- Settings Tab -->
        <section id="view-settings" class="tab-view hidden"></section>
        <section id="view-qrtools" class="tab-view hidden"></section>

        <!-- Finance & AI Tab -->
        <section id="view-finance" class="tab-view hidden"></section>

      </main>
    </div>

  </div>

  <!-- Main JavaScript Bootstrapper -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
